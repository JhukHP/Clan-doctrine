site_name: STALZONE Clan Playbook

site_url: https://jhukhp.github.io/Clan-doctrine/

site_description: Internal clan documentation

theme:
  name: material
  language: ru
  features:
    - navigation.indexes
  palette:
    scheme: slate

plugins:
  - search

docs_dir: docs

nav:
  - Главная: index.md

  - Внедрение:
      - План внедрения: 00-implementation/01_IMPLEMENTATION_PLAN.md
      - Форма обратной связи: 00-implementation/02_FEEDBACK_TEMPLATE.md
      - Журнал изменений по результатам проверки: 00-implementation/03_CHANGELOG_0.1_REVIEW.md

  - Устав:
      - 01-charter/index.md
      - Устав клана: 01-charter/01_CLAN_CHARTER.md

  - Организация:
      - 02-organization/index.md
      - Структура клана: 02-organization/01_CLAN_STRUCTURE.md
      - Роли и обязанности: 02-organization/02_ROLES_AND_RESPONSIBILITIES.md
      - Состав и ротация: 02-organization/03_ROSTER_AND_ROTATION.md

  - SOP:
      - 03-sop/index.md
      - Коммуникация: 03-sop/SOP-001_COMMUNICATION_PROTOCOL.md
      - Подготовка к матчу: 03-sop/SOP-002_MATCH_START_PROTOCOL.md
      - Работа с точками: 03-sop/SOP-003_POINT_CONTROL_PROTOCOL.md
      - Усиление точки: 03-sop/SOP-004_REINFORCEMENT_PROTOCOL.md
      - Работа ралик-отряда: 03-sop/SOP-005_RALLY_PROTOCOL.md

  - Руководства:
      - 04-guides/index.md

  - Обучение:
      - 05-training/index.md
      - План тренировок: 05-training/01_TRAINING_PLAN_PHASE_1.md
      - Руководство мастера: 05-training/02_MASTER_PLAYER_GUIDE.md
      - Руководство напарника мастера: 05-training/03_MASTER_PARTNER_GUIDE.md

  - Анализ:
      - 06-analysis/index.md
      - Разбор после матча (AAR): 06-analysis/01_AFTER_ACTION_REVIEW.md

  - Межсезонье:
      - 07-offseason/index.md

  - Приложения:
      - 08-appendix/index.md

  - Аудит:
      - Аудит версии 0.1: reviews/AUDIT_0.1.md
